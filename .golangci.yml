version: "2"
run:
  go: "1.25"
  # Lint build-tag-gated sources too. Without this, files behind
  # `//go:build trace_pipeline` (the trace pipeline integration suites) are
  # invisible to `make lint`, letting dead code and formatting debt accumulate
  # silently — they still compile via `make test-trace-pipeline`, and unused
  # package-level vars/funcs are not compile errors in Go.
  build-tags:
    - trace_pipeline
linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - contextcheck
    - decorder
    - dogsled
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    # goconst is intentionally not enabled. v1.64.8's goconst reported nothing
    # at min-occurrences 4 (the setting it was configured with), so it never
    # gated anything. v2.14.0 ships a rewritten goconst that counts strictly
    # more occurrences per string and reports ~269 findings at the same
    # threshold — mostly cobra `Use:` strings, test-fixture generators and
    # protocol field names, where a named constant would be noise rather than
    # a fix. Re-enabling it is a separate, deliberate cleanup.
    # - goconst
    - gocritic
    - gocyclo
    - godot
    - goprintffuncname
    - gosec
    - govet
    - importas
    - ineffassign
    - lll
    - misspell
    - staticcheck
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - whitespace
  settings:
    exhaustive:
      check:
        - switch
        - map
      default-signifies-exhaustive: true
      ignore-enum-members: .+UNSPECIFIED$
    exhaustruct:
      exclude:
        - cobra\.Command$
    gocritic:
      enabled-checks:
        - appendCombine
        - boolExprSimplify
        - builtinShadow
        - commentedOutCode
        - commentedOutImport
        - docStub
        - emptyFallthrough
        - equalFold
        - hexLiteral
        - indexAlloc
        - initClause
        - methodExprCall
        - nilValReturn
        - octalLiteral
        - rangeExprCopy
        - stringXbytes
        - typeAssertChain
        - typeUnparen
        - unnecessaryBlock
        - weakCond
    godot:
      scope: toplevel
    gosec:
      excludes:
        - G115
        - G118
        - G122
        - G602
        - G702
        - G703
    govet:
      disable:
        - inline
      enable:
        - fieldalignment
        - shadow
    importas:
      no-unaliased: true
      alias:
        - pkg: github.com/apache/skywalking-banyandb/api/proto/banyandb/common/v1
          alias: commonv1
        - pkg: github.com/apache/skywalking-banyandb/api/proto/banyandb/database/v1
          alias: databasev1
        - pkg: github.com/apache/skywalking-banyandb/api/proto/banyandb/model/v1
          alias: modelv1
        - pkg: github.com/apache/skywalking-banyandb/api/proto/banyandb/property/v1
          alias: propertyv1
        - pkg: github.com/apache/skywalking-banyandb/api/proto/banyandb/measure/v1
          alias: measurev1
        - pkg: github.com/apache/skywalking-banyandb/api/proto/banyandb/stream/v1
          alias: streamv1
        - pkg: github.com/apache/skywalking-banyandb/api/proto/banyandb/cluster/v1
          alias: clusterv1
        - pkg: github.com/apache/skywalking-banyandb/api/proto/banyandb/trace/v1
          alias: tracev1
        - pkg: github.com/apache/skywalking-banyandb/pkg/pb/v1
          alias: pbv1
    lll:
      line-length: 170
    misspell:
      locale: US
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF1002
        - -QF1007
        - -QF1008
        - -QF1011
        - -QF1012
    unparam:
      check-exported: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - '*'
        path: .*\.pb\.go
      - linters:
          - '*'
        path: .*\.pb\.validate\.go
      - linters:
          - '*'
        path: .*\.gen\.go
      - linters:
          - errcheck
          - maligned
        path: _test\.go$|^tests/|^samples/
      # This executable contract is intentionally kept stable while implementations move
      # from RED to GREEN. Its table layout and explicit helper arguments favor reviewability.
      - linters:
          - govet
        path: fragment_guard_contract_test\.go$
        text: fieldalignment
      - linters:
          - unparam
        path: fragment_guard_contract_test\.go$
      - linters:
          - staticcheck
        text: 'SA1019: package github.com/golang/protobuf'
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-same-issues: 0
formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/apache/skywalking-banyandb/)
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
