# Golden expectation captured from the ROW query path (stream.Query ->
# BuildElementsFromStreamResult) on branch rowdrop/base, before the row path was
# removed (apache/skywalking#13998). It cannot be re-captured afterwards.
#
# Normalization, forced by the fixture generator:
#   ts   - nanosecond offset from the query time range start. generateData anchors
#          element timestamps at time.Now(), so absolute timestamps differ per run.
#   tags - only entity-tag is recorded. The sibling filter-tag is drawn from
#          crypto/rand per run (benchmark_test.go generateRandomNumber), so its
#          value is not reproducible and no golden can pin it.
# Element order is as the row path returned it.
name: parity_topn_multiseries_asc
