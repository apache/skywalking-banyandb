version: "2"
run:
  timeout: 20m
linters:
  default: none
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/apache/skywalking-banyandb/)
  exclusions:
    generated: lax
    paths:
      - .*\.pb\.go
      - .*\.pb\.gw\.go
      - .*\.gen\.go
      - .*_mock\.go
      - node_modules
      - dist
      - third_party$
      - builtin$
      - examples$
