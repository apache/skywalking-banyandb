name: Continuous Integration

on:
  pull_request:
    paths-ignore:
      - 'canopy/**'
      - 'docs/**'
      - '**.md'
      - '.github/workflows/canopy.yml'
  push:
    branches:
      - main

env:
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 5

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare (Generate)
    uses: ./.github/workflows/prepare.yml
  check:
    name: Check
    runs-on: ubuntu-latest
    needs: [prepare]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-tags: true
      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
        with:
          download-artifacts: 'true'
          # The license artifacts below are generated in the pinned build
          # environment, which needs a Buildx-capable builder. The default
          # Docker driver cannot always export a local cache, so the canonical
          # builder is requested explicitly.
          setup-docker: 'true'
          # Buildx only. The pinned image is amd64-only (PLATFORM is a constant in
          # dockerize.mk, not an override) and the runner is amd64, so nothing here
          # is ever emulated. QEMU is disabled deliberately: it needs a privileged
          # container to install binfmt handlers, and adding a privileged step to
          # the most important job in CI to support a platform we do not build is a
          # bad trade.
          setup-qemu: 'false'
      - name: Cache Tools
        uses: actions/cache@v4
        id: cache-tool
        with:
          path: bin
          key: ${{ runner.os }}-${{ runner.arch }}-generate-tool-${{ hashFiles('scripts/build/version.mk') }}
      - name: Run consistency check
        run: |
          if [ ! -z "`git status -s`" ]; then \
            echo "Following files are not consistent with CI:"; \
            git status -s; \
            exit 1; \
          fi
      - name: Generate test cases and check drift
        run: |
          make generate-test-cases
          git diff --exit-code -- test/cases/measure/data/input/ \
          || (echo "::error::Generated test cases have drifted. Run 'make generate-test-cases' locally and commit the changes." \
          && git diff --stat -- test/cases/measure/data/input/ \
          && exit 1)
      - name: Check License Header
        run: make license-check
      - name: Check requirements
        run: make check-req
      - name: Build binaries and MCP dist
        run: make build
      - name: Test MCP (Go validator tool + TypeScript safety layer)
        run: make -C mcp test
      - name: Lint
        run: make lint
      # Both paths run, each snapshotted, then compared, so a broken image
      # cannot hide a license change and a license change cannot hide a broken
      # image. There is no cross-host matrix: `eol=lf` normalizes the checkout and
      # the tree is streamed into the container rather than mounted, so the host
      # is not a variable in the output. See
      # docs/design/0.12.0/docker-canonical-build/README.md §7.1 and §7.2.
      - name: Generate dependency licenses (native baseline)
        run: make license-dep
      - name: Capture the native manifest
        # Written outside the worktree: an untracked file here would make the
        # `make check-format` step below fail on a dirty `git status`.
        run: make license-manifest > ${{ runner.temp }}/native.manifest
      - name: Generate dependency licenses (Docker, canonical)
        run: make docker-license-dep
      - name: Capture the canonical manifest
        run: make license-manifest > ${{ runner.temp }}/canonical.manifest
      - name: Native and canonical output must be byte-identical
        run: diff -u ${{ runner.temp }}/native.manifest ${{ runner.temp }}/canonical.manifest
      - name: Check
        run: make check-format
  vuln-check:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [prepare]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
        with:
          download-artifacts: 'true'
          setup-node: 'false'
          setup-docker: 'false'
      - name: Cache Tools
        uses: actions/cache@v4
        with:
          path: bin
          key: ${{ runner.os }}-${{ runner.arch }}-vuln-tool-${{ hashFiles('scripts/build/version.mk') }}
      - name: Run govulncheck (stdlib + dependency CVEs)
        run: make vuln-check
  detect_fodc_e2e_changes:
    name: Detect FODC E2E Changes
    runs-on: ubuntu-latest
    needs: [prepare]
    outputs:
      should_run: ${{ steps.filter.outputs.should_run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changed files for FODC E2E
        id: filter
        run: |
          set -euo pipefail

          should_run=true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            should_run=false
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
            changed_files="$(git diff --name-only "${base_sha}" "${head_sha}")"
            while IFS= read -r changed_file; do
              case "${changed_file}" in
                fodc/*|test/fodc/*|banyand/*|api/proto/*|scripts/build/*)
                  should_run=true
                  break
                  ;;
                .github/actions/setup-build-env/*|.github/workflows/test-fodc-e2e.yml|.github/workflows/prepare.yml|.github/workflows/ci.yml)
                  should_run=true
                  break
                  ;;
              esac
            done <<< "${changed_files}"
          fi

          echo "should_run=${should_run}" >> "${GITHUB_OUTPUT}"
  detect_trace_pipeline_e2e_changes:
    name: Detect Trace Pipeline E2E Changes
    runs-on: ubuntu-latest
    needs: [prepare]
    outputs:
      should_run: ${{ steps.filter.outputs.should_run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changed files for trace pipeline E2E
        id: filter
        run: |
          set -euo pipefail

          should_run=true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            should_run=false
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
            changed_files="$(git diff --name-only "${base_sha}" "${head_sha}")"
            while IFS= read -r changed_file; do
              case "${changed_file}" in
                banyand/trace/*|pkg/pipeline/sdk/*|test/plugins/_latencystatussampler/*|test/cases/tracepipeline/*|test/e2e/tracepipeline/*)
                  should_run=true
                  break
                  ;;
                .github/actions/setup-build-env/*|.github/workflows/test-trace-pipeline-e2e.yml|.github/workflows/prepare.yml|.github/workflows/ci.yml)
                  should_run=true
                  break
                  ;;
              esac
            done <<< "${changed_files}"
          fi

          echo "should_run=${should_run}" >> "${GITHUB_OUTPUT}"
  test-gate:
    name: Enable Tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Tests enabled'
  test-banyand:
    name: Test Banyand
    needs: [prepare, test-gate]
    uses: ./.github/workflows/test-banyand.yml
  test-bydbctl:
    name: Test Bydbctl
    needs: [prepare, test-gate]
    uses: ./.github/workflows/test-bydbctl.yml
  test-fodc:
    name: Test FODC
    needs: [prepare, test-gate]
    uses: ./.github/workflows/test-fodc.yml
  build-system:
    name: Build System (Linux / macOS / Windows)
    needs: [prepare, test-gate]
    uses: ./.github/workflows/test-build-system.yml
  test-fodc-e2e:
    name: Test FODC E2E
    needs: [prepare, detect_fodc_e2e_changes, test-gate]
    uses: ./.github/workflows/test-fodc-e2e.yml
    with:
      should_run: ${{ github.event_name != 'pull_request' || needs.detect_fodc_e2e_changes.outputs.should_run == 'true' }}
  test-trace-pipeline-e2e:
    name: Test Trace Pipeline E2E
    needs: [prepare, detect_trace_pipeline_e2e_changes, test-gate]
    uses: ./.github/workflows/test-trace-pipeline-e2e.yml
    with:
      should_run: ${{ github.event_name != 'pull_request' || needs.detect_trace_pipeline_e2e_changes.outputs.should_run == 'true' }}
  test-pkg:
    name: Test Pkg
    needs: [prepare, test-gate]
    uses: ./.github/workflows/test-pkg.yml
  test-integration-standalone:
    name: Test Integration Standalone
    needs: [prepare, test-gate]
    uses: ./.github/workflows/test-integration-standalone.yml
  test-integration-distributed:
    name: Test Integration Distributed
    needs: [prepare, test-gate]
    uses: ./.github/workflows/test-integration-distributed.yml
  e2e:
    name: E2E Tests
    needs: [prepare, test-gate]
    uses: ./.github/workflows/e2e.yml

  result:
    name: Continuous Integration
    runs-on: ubuntu-24.04
    if: |
      always() &&
      needs.check.result == 'success' &&
      needs.vuln-check.result == 'success' &&
      needs.detect_fodc_e2e_changes.result == 'success' &&
      needs.detect_trace_pipeline_e2e_changes.result == 'success' &&
      (needs.test-gate.result == 'skipped' || success()) && \
      needs.build-system.result == 'success'
    needs:
      - check
      - vuln-check
      - detect_fodc_e2e_changes
      - detect_trace_pipeline_e2e_changes
      - test-gate
      - test-banyand
      - test-bydbctl
      - test-fodc
      - test-fodc-e2e
      - build-system
      - test-trace-pipeline-e2e
      - test-pkg
      - test-integration-standalone
      - test-integration-distributed
      - e2e
    steps:
      - run: echo 'success'
