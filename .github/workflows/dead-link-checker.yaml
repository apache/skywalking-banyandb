name: Dead Link Checker

on:
  pull_request:
    paths:
      - '**.md'
      - '!vendor/**'
      - '!ui/**'
      - '!canopy/**'
  schedule:
    - cron: '0 18 * * *'  # TimeZone: UTC 0

concurrency:
  group: dlc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  CheckDeadLinks:
    if: (github.event_name == 'schedule' && github.repository == 'apache/skywalking-banyandb') || (github.event_name != 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo npm install -g markdown-link-check@3.10.0
      - name: Scan changed markdown files
        if: github.event_name == 'pull_request'
        run: |
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          mapfile -t changed < <(git diff --name-only --diff-filter=ACMRT "${base_sha}..${head_sha}" -- '*.md' \
            | grep -v '^vendor/' | grep -v '^ui/' | grep -v '^canopy/')
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "No tracked *.md files changed; nothing to scan."
            exit 0
          fi
          echo "Scanning ${#changed[@]} changed markdown file(s):"
          printf '  - %s\n' "${changed[@]}"
          status=0
          for file in "${changed[@]}"; do
            if ! markdown-link-check -c .dlc.json -q "$file"; then
              status=1
            fi
          done
          exit "$status"
      - name: Scan all markdown files (schedule)
        if: github.event_name == 'schedule'
        run: |
          mapfile -t files < <(find . -name "*.md" \
            -not -path './vendor/*' -not -path './ui/*' -not -path './canopy/*')
          echo "Scanning ${#files[@]} markdown file(s)."
          status=0
          for file in "${files[@]}"; do
            if ! markdown-link-check -c .dlc.json -q "$file"; then
              status=1
            fi
          done
          exit "$status"

  # ── Required-check shims for markdown-only PRs ──────────────────────────────
  # Branch protection requires the Go pipeline's aggregate checks ("Continuous
  # Integration" from ci.yml and "push-banyandb-image" from publish-docker.yml).
  # Those workflows are `paths-ignore: '**.md'`, so on a markdown-only PR they
  # never run and GitHub parks the required checks as "Expected", blocking
  # merge even though the change touches no Go code. This workflow DOES run
  # for markdown changes (and is itself ignored by ci.yml/publish-docker.yml),
  # so report the same check contexts here as trivially-successful
  # placeholders — the same pattern canopy.yml uses for canopy-only PRs.
  # A PR that also touches Go code triggers the real workflows, which report
  # these contexts for real.
  #
  # Restricted to pull_request: on a push to main this workflow runs for EVERY
  # commit, and so do the real ci.yml / publish-docker.yml. Two workflows
  # reporting the same check context on one commit would let these no-op jobs
  # mask a genuine failure of the real ones. Branch protection only evaluates
  # required checks on PRs, so gating here costs nothing.
  continuous-integration:
    name: Continuous Integration
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Markdown-only change — Go CI (ci.yml) skipped via paths-ignore; required check satisfied."

  push-banyandb-image:
    name: push-banyandb-image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Markdown-only change — docker image build (publish-docker.yml) skipped via paths-ignore; required check satisfied."