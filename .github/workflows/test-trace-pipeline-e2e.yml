name: Trace Pipeline E2E

# E2E gate for the trace pipeline native plugin: builds the .so + CGO
# banyand-server, launches a real standalone whose pipeline reconciler
# observes a property-schema-driven sampler registration, runs the dynamic
# lifecycle (Register/Update/Remove/InvalidConfig) and asserts the
# schema-store replay after process restart. Replaces the in-process
# integration suites under test/integration/{standalone,distributed}/pipeline
# that previously forked a binary via pkg/test/setup/external.go.
#
# Self-contained, like test-plugin-sidecar-e2e.yml: own failure domain, own
# build of the .so and CGO server (CGO_ENABLED=1, no -race — see
# Makefile "Trace pipeline plugin targets" comment for the rationale).
# Path filters keep the gate off unrelated changes; workflow_dispatch allows
# manual runs.
on:
  pull_request:
    paths:
      - 'banyand/trace/**'
      - 'pkg/pipeline/sdk/**'
      - 'test/plugins/_latencystatussampler/**'
      - 'test/cases/tracepipeline/**'
      - 'test/e2e/tracepipeline/**'
      - '.github/workflows/test-trace-pipeline-e2e.yml'
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  trace-pipeline-e2e:
    if: github.repository == 'apache/skywalking-banyandb'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
        with:
          # The prepare.yml artifacts (proto + ui) are not strictly required
          # here — this job generates + builds what it needs itself — but the
          # shared action defaults to download-artifacts:true and the proto
          # generation in this repo is idempotent, so let it pull the artifact
          # rather than disabling it.
          download-artifacts: 'true'

      - name: Run trace pipeline e2e gate
        run: |
          # The gate builds the .so + CGO banyand-server itself via the
          # Makefile targets and runs the bash orchestrator at
          # test/e2e/tracepipeline/run.sh, which:
          #   1. starts a standalone with the trusted-plugin dir + sampler
          #      flags,
          #   2. drives Register/Update/Remove/InvalidConfig over property
          #      schema, asserts sampler drop/keep decisions,
          #   3. kills + relaunches the standalone from the same data dir,
          #      asserts the schema store replayed the pipeline without a
          #      second RegisterSamplerRuntime call.
          # See test/e2e/tracepipeline/run.sh header for the assertion list
          # and the env knobs.
          make test-trace-pipeline