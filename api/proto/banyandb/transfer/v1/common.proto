syntax = "proto3";

package banyandb.transfer.v1;

option go_package = "github.com/apache/skywalking-banyandb/api/proto/banyandb/transfer/v1";
option java_package = "org.apache.skywalking.banyandb.transfer.v1";

// RateLimit caps the data a data node handles for a transfer, per node; 0 means unlimited.
// In an Export stream the producing node enforces it on that stream: only the producer knows
// how many rows it has written. In an ImportRows stream the liaison forwards it to every target
// data node, which admits the rows of all imports through one bucket: the rate holds on the
// node however many liaisons write to it, and the import that wrote last sets it.
message RateLimit {
  // Bytes per second: the chunks an export sends, after compression, or the internal write
  // requests an import sends to the node.
  uint64 bytes_per_second = 1;
  // Rows per second: the rows an export encodes (CSV only, native ignores it), or the rows an
  // import writes to the node.
  uint64 rows_per_second = 2;
}
