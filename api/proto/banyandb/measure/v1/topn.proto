syntax = "proto3";

package banyandb.measure.v1;

import "banyandb/common/v1/trace.proto";
import "banyandb/model/v1/common.proto";
import "banyandb/model/v1/query.proto";
import "google/protobuf/timestamp.proto";
import "validate/validate.proto";

option go_package = "github.com/apache/skywalking-banyandb/api/proto/banyandb/measure/v1";
option java_package = "org.apache.skywalking.banyandb.measure.v1";

// TopNList contains a series of topN items
message TopNList {
  // timestamp is in the timeunit of milliseconds.
  google.protobuf.Timestamp timestamp = 1;
  message Item {
    repeated model.v1.Tag entity = 1;
    model.v1.FieldValue value = 2;
    int64 version = 3;
    google.protobuf.Timestamp timestamp = 4;
  }
  // items contains top-n items in a list
  repeated Item items = 2;
}

// TopNResponse is the response for a query to the Query module.
message TopNResponse {
  // lists contain a series topN lists ranked by timestamp
  // if agg_func in query request is specified, lists' size should be one.
  repeated TopNList lists = 1;
  // trace contains the trace information of the query when trace is enabled
  common.v1.Trace trace = 2;
}

// TopNRequest is the request contract for query.
message TopNRequest {
  // groups indicate where the data points are stored.
  repeated string groups = 1 [(validate.rules).repeated = {
    min_items: 1
    max_items: 64
    items: {
      string: {
        min_len: 1
        max_len: 255
        pattern: "^[a-zA-Z0-9_]([a-zA-Z0-9._-]*[a-zA-Z0-9])?$"
      }
    }
  }];
  // name is the identity of a measure.
  string name = 2 [(validate.rules).string = {
    min_len: 1
    max_len: 255
    pattern: "^[a-zA-Z0-9_]([a-zA-Z0-9._-]*[a-zA-Z0-9])?$"
  }];
  // time_range is a range query with begin/end time of entities in the timeunit of milliseconds.
  model.v1.TimeRange time_range = 3 [(validate.rules).message.required = true];
  // top_n set the how many items should be returned in each list.
  int32 top_n = 4 [(validate.rules).int32 = {
    gt: 0
    lte: 10000
  }];
  // agg aggregates lists grouped by field names in the time_range
  model.v1.AggregationFunction agg = 5;
  // criteria select counters. Only equals are acceptable.
  repeated model.v1.Condition conditions = 6;
  // field_value_sort indicates how to sort fields
  model.v1.Sort field_value_sort = 7;
  // trace is used to enable trace for the query
  bool trace = 8;
  // stages is used to specify the stage of the data points in the lifecycle
  repeated string stages = 9;
}

// InternalTopNRequest is the request a liaison sends to the data nodes for a distributed TopN query
// with an aggregation function. It is internal to a cluster.
message InternalTopNRequest {
  // request is the client's request. Its agg is the function the partial aggregates are computed for.
  TopNRequest request = 1;
  // partial_limit is how many items a data node returns for each shard, ranked by the aggregate of
  // the windows that shard holds.
  int32 partial_limit = 2;
}

// InternalTopNPartial is the partial aggregate of one item over the windows a shard holds in the time range.
message InternalTopNPartial {
  // entity identifies the item.
  repeated model.v1.Tag entity = 1;
  // partial is the partial aggregate: the sum and then the count for MEAN, the sum for SUM, the count for COUNT,
  // the maximum for MAX and the minimum for MIN.
  repeated model.v1.FieldValue partial = 2;
}

// InternalTopNShard is the answer of one shard of a data node.
message InternalTopNShard {
  // shard_id is the shard the partial aggregates were computed from.
  uint32 shard_id = 1;
  // partials are the shard's best items, ranked by their aggregate over the shard's windows.
  repeated InternalTopNPartial partials = 2;
}

// InternalTopNResponse is a data node's answer to an InternalTopNRequest.
message InternalTopNResponse {
  // shards contains one answer per shard the data node holds.
  repeated InternalTopNShard shards = 1;
  // trace contains the trace information of the query when trace is enabled
  common.v1.Trace trace = 2;
}
