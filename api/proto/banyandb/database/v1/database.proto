syntax = "proto3";

package banyandb.database.v1;

import "banyandb/cluster/v1/rpc.proto";
import "banyandb/common/v1/common.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/apache/skywalking-banyandb/api/proto/banyandb/database/v1";
option java_package = "org.apache.skywalking.banyandb.database.v1";

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_META = 1;
  ROLE_DATA = 2;
  ROLE_LIAISON = 3;
}

message Node {
  common.v1.Metadata metadata = 1;
  repeated Role roles = 2;
  string grpc_address = 3;
  string http_address = 4;
  google.protobuf.Timestamp created_at = 5;
  // labels is a set of key-value pairs to describe the node.
  map<string, string> labels = 6;
  string property_repair_gossip_grpc_address = 7;
  string property_schema_grpc_address = 8;
  string property_schema_gossip_grpc_address = 9;
  // version reports the file format versions the node accepts and its API version.
  cluster.v1.VersionInfo version = 10;
  // tz_name is the IANA name of the node's local time zone, for example
  // "Asia/Shanghai". It is empty when the node cannot determine the name, which
  // means "unknown" rather than "matches whatever the other side reports".
  string tz_name = 11;
}

message Shard {
  uint64 id = 1;
  common.v1.Metadata metadata = 2;
  common.v1.Catalog catalog = 3;
  string node = 4;
  uint32 total = 5;
  google.protobuf.Timestamp updated_at = 6;
  google.protobuf.Timestamp created_at = 7;
}
