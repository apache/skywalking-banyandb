# Output of scripts/resume-import.sh <liaison> summary: the import again without --resume exits 1
# with the --resume hint after the resume summary (RESUME, DONE, LEFT, AMBIGUOUS) is printed, and
# changes nothing; --dry-run exits 0 and
# prints the summary (DONE, LEFT, the AMBIGUOUS payloads with their action or policy: a native part
# in flight, or the rows a CSV item sent after its cursor). The progress file is left as it was.
exitCode: 1
resumeHint: true
summaryShown: true
ambiguousShown: true
dryRunExitCode: 0
resumeLine: true
summaryDone: true
summaryLeft: true
ambiguousListed: true
policiesNamed: true
ambiguousNamed: true
progressUnchanged: true
