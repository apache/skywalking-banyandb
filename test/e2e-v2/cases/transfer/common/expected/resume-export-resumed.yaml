# Output of scripts/resume-export.sh <liaison> resumed: the export resumed without a rate limit
# finishes (exit 0, RESUMED line naming the units done before it, none of whose files it rewrote),
# writes the manifest, removes the progress file, leaves no .tmp and
# no file the manifest does not list, releases its session (release-session of that id exits 2: it
# is held on no node) and the export checker accepts the artifact.
exitCode: 0
resumedLine: true
resumedTheUnitsDone: true
doneFilesUnchanged: true
manifest: true
unitsAsPlanned: true
progressFile: false
tmpFiles: 0
unlistedFiles: 0
sessionReleasedExitCode: 2
sessionNotHeld: true
checkerExitCode: 0
