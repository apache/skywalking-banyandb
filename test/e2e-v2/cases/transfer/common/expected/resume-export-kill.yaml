# Output of scripts/resume-export.sh <liaison> kill: the resumed export killed with kill -9 while a
# unit is in flight leaves the progress file, and files below nodes/ that it does not list (a .tmp
# or a volume of the unfinished unit). Which unit was in flight is written only with the next write
# of the progress file, so a kill may leave it unrecorded; it is not checked.
