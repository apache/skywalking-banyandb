# Output of scripts/resume-import.sh <liaison> resumed: --resume --verify finishes the import and
# verify passes (rows pushed again are warnings), counting on its VERIFY line the groups it checked
# partially; the run reports as done exactly the work items complete before it; the stream and
# trace rows pushed, over every run, exceed those of one uninterrupted import by no more than the
# rows recorded as possible duplicates; the progress file is kept, named on the run's
# "progress: <file>" line, with every planned item complete and nothing in flight; and its cursor
# side file is deleted.
exitCode: 0
resumedLine: true
resumedTheItemsDone: true
verifyOk: true
partialCounted: true
nothingLost: true
duplicatesBounded: true
progressKept: true
progressLine: true
cursorRemoved: true
allComplete: true
nothingInFlight: true
