# Output of scripts/resume-import.sh <liaison> again: the finished import run again exits 0 without
# asking, says it is already imported, pushes nothing and skips verify with a NOTE; with an
# explicit --verify it verifies against the baseline of the first run and passes. The progress
# file is unchanged.
exitCode: 0
alreadyImported: true
nothingPushed: true
askedNothing: true
verifySkipped: true
verifyExitCode: 0
verifyAlreadyImported: true
verifyAgainstBaseline: true
verifyOk: true
progressUnchanged: true
