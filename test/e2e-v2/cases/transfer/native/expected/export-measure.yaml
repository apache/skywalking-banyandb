# Output of FORMAT=native scripts/export.sh <liaison> measure: a native export of the measure catalog
# validated container by container by the export checker (checker native: the manifest, every
# file's bytes and crc32, every container's volumes verifying as one set, every shard container
# holding whole parts, the segment metadata of every segment unit, no manifest warning), then the
# export snapshots left on either data node (none: a finished export releases its session).
exitCode: 0
format: native
compress: none
catalogs: [measure]
checks:
  formatNative: ok
  filesMatchManifest: ok
  containersVerify: ok
  shardsHoldWholeParts: ok
  segmentMetadata: ok
  noWarnings: ok
leftoverSnapshots: []
checkerExitCode: 0
