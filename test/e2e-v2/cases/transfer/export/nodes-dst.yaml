# File-based node discovery of the import destination cluster: one hot and one warm data node
# plus liaison_dst. The addresses are the network aliases docker-compose.yml gives them.
nodes:
  - name: data-dst-hot1
    grpc_address: data-dst-hot1:17912
  - name: data-dst-warm1
    grpc_address: data-dst-warm1:17912
  - name: liaison-dst
    grpc_address: liaison-dst:17912
