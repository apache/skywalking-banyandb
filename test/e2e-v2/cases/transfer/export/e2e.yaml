# Export e2e (dry run and CSV export) on docker compose: one hot and one warm data node behind a
# liaison (file-based node discovery), OAP + trace-mocker as the data source. Setup only prepares the
# environment and its data: it builds bydbctl for the host, waits for the mocker, runs the
# lifecycle agent once inside the hot node so the warm node holds the segments whose end is
# older than the one-day hot TTL, and reports a few events through OAP so the stream catalog
# is guaranteed current rows (OAP may also derive older records from the mocker traces); OAP
# writes the property catalog itself at startup. Every check runs in verify: the reports cover
# all four catalogs (stream, measure regular and index-mode, trace and property) and are
# compared against go-template expectations, retried until the data has settled. Two kinds of
# case need a script: the CSV exports, one per catalog plus a --schema-only one, whose artifacts
# the export checker (checker/, a Go program built in setup) validates row by row on the host,
# and the degraded-node scenario, which has to stop and restart a container between two reports.
# The last four cases import the source's full export (artifact A) into a second, empty cluster
# (liaison_dst, data_dst_hot1, data_dst_warm1; host ports 27912/27913) in order: an import
# without the schema that the empty destination refuses, a schema conflict that refuses the
# import, each checked as a dry run and for real, a dry run whose decision table the real import must repeat,
# and the round trip that re-exports the destination and compares it with A row by row and by
# queries. They share state through markers in a fixed work directory (scripts/import-common.sh)
# that the setup empties, so a retry never imports twice.
#
# Run locally after building the testing image (see test/docker/Dockerfile; TARGET_OS=linux):
#   set -a; source <(grep -v '^#' test/e2e-v2/script/env); set +a
#   TAG=local e2e run -c test/e2e-v2/cases/transfer/export/e2e.yaml

setup:
  env: compose
  file: docker-compose.yml
  timeout: 25m
  init-system-environment: ../../../script/env
  steps:
    - name: set PATH
      command: export PATH=/tmp/skywalking-infra-e2e/bin:$PATH
    - name: build bydbctl for the host
      command: go build -o /tmp/skywalking-infra-e2e/bin/bydbctl ./bydbctl/cmd/cli
    - name: build the export checker for the host
      command: go build -o /tmp/skywalking-infra-e2e/bin/export-checker ./test/e2e-v2/cases/transfer/export/checker
    - name: wait for trace-mocker data on the hot node
      command: bash test/e2e-v2/cases/transfer/export/scripts/wait-for-data.sh
    - name: migrate segments older than the hot TTL to the warm node
      command: bash test/e2e-v2/cases/transfer/export/scripts/run-lifecycle.sh
    - name: install swctl
      command: bash test/e2e-v2/script/prepare/setup-e2e-shell/install.sh swctl
    - name: report events so the stream catalog holds data
      command: bash test/e2e-v2/cases/transfer/export/scripts/report-events.sh ${oap_host}:${oap_11800}
    - name: reset the work directory of the import cases
      command: bash -c 'source test/e2e-v2/cases/transfer/export/scripts/import-common.sh && rm -rf "$IMPORT_WORK"'

verify:
  # Every case is idempotent (csv-export.sh exports into a new directory and releases the session
  # of a failed export; degraded.sh restarts the warm node on every exit path), so a case
  # is retried until the data it pins has settled: the liaison answering ExportService, OAP
  # flushing the reported events, and the warm node exposing the parts the lifecycle run
  # migrated. 30 retries 10s apart give about five minutes.
  retry:
    count: 30
    interval: 10s
  fail-fast: true
  cases:
    # Releasing a session no data node holds: every node answers none through the liaison's
    # Sessions fan-out, so bydbctl reports the unknown session and exits 2.
    - query: >-
        rc=0; out=$(bydbctl data release-session --id deadbeefdeadbeefdeadbeefdeadbeef --nodes ${liaison_host}:${liaison_17912} 2>&1) || rc=$?;
        echo "exitCode: $rc";
        echo "message: $(echo "$out" | grep -o 'export session deadbeefdeadbeefdeadbeefdeadbeef is not held on any data node')"
      expected: expected/release-session.yaml
    - query: >-
        bydbctl data export --dry-run --nodes ${liaison_host}:${liaison_17912}
        --selector catalog=stream --selector catalog=measure --selector catalog=trace --selector catalog=property -o yaml
      expected: expected/dry-run.yaml
    - query: bydbctl data export --dry-run --plan test/e2e-v2/cases/transfer/export/plan.yaml -o yaml
      expected: expected/dry-run.yaml
    - query: bash test/e2e-v2/cases/transfer/export/scripts/csv-export.sh ${liaison_host}:${liaison_17912} stream
      expected: expected/csv-export-stream.yaml
    - query: bash test/e2e-v2/cases/transfer/export/scripts/csv-export.sh ${liaison_host}:${liaison_17912} measure
      expected: expected/csv-export-measure.yaml
    - query: bash test/e2e-v2/cases/transfer/export/scripts/csv-export.sh ${liaison_host}:${liaison_17912} trace
      expected: expected/csv-export-trace.yaml
    - query: bash test/e2e-v2/cases/transfer/export/scripts/csv-export.sh ${liaison_host}:${liaison_17912} property
      expected: expected/csv-export-property.yaml
    - query: bash test/e2e-v2/cases/transfer/export/scripts/csv-export.sh ${liaison_host}:${liaison_17912} schema-only
      expected: expected/csv-export-schema-only.yaml
    - query: bash test/e2e-v2/cases/transfer/export/scripts/degraded.sh ${liaison_host}:${liaison_17912}
      expected: expected/degraded.yaml
    # Import cases, in this order (see scripts/import-common.sh for the markers that make them
    # safe to retry). The source liaison is only needed to freeze artifact A and for the queries.
    - query: bash test/e2e-v2/cases/transfer/export/scripts/import-noschema.sh ${liaison_host}:${liaison_17912}
      expected: expected/import-noschema.yaml
    - query: bash test/e2e-v2/cases/transfer/export/scripts/import-conflict.sh ${liaison_host}:${liaison_17912}
      expected: expected/import-conflict.yaml
    - query: bash test/e2e-v2/cases/transfer/export/scripts/import-dryrun.sh
      expected: expected/import-dryrun.yaml
    - query: bash test/e2e-v2/cases/transfer/export/scripts/import-roundtrip.sh ${liaison_host}:${liaison_17912}
      expected: expected/import-roundtrip.yaml

cleanup:
  on: always
  collect:
    on: failure
    output-dir: $SW_INFRA_E2E_LOG_DIR/banyandb-data
    items:
      - service: data-hot1
        paths:
          - /tmp/stream/
          - /tmp/measure/
          - /tmp/trace/
          - /tmp/property/
          - /tmp/lifecycle-report/ # only present once run-lifecycle.sh ran; missing before that
      - service: data-warm1
        paths:
          - /tmp/stream/
          - /tmp/measure/
          - /tmp/trace/
          - /tmp/property/
      - service: data_dst_hot1
        paths:
          - /tmp/stream/
          - /tmp/measure/
          - /tmp/trace/
          - /tmp/property/
      - service: data_dst_warm1
        paths:
          - /tmp/stream/
          - /tmp/measure/
          - /tmp/trace/
          - /tmp/property/
