# Output of scripts/csv-export.sh <liaison> schema-only: a --schema-only export of all four catalogs
# writes schema/ and manifest.json only, without a session or any data, and leaves no snapshot.
# The schema holds every kind, OAP's groups with the stages the e2e configures and the schema of
# the resources the catalog exports check the rows of.
exitCode: 0
format: csv
schema:
  counts:
    group: {{ gt .schema.counts.group 0 }}
    stream: {{ gt .schema.counts.stream 0 }}
    measure: {{ gt .schema.counts.measure 0 }}
    trace: {{ gt .schema.counts.trace 0 }}
    property: {{ gt .schema.counts.property 0 }}
    indexRule: {{ gt .schema.counts.indexRule 0 }}
    indexRuleBinding: {{ gt .schema.counts.indexRuleBinding 0 }}
    topNAggregation: {{ gt .schema.counts.topNAggregation 0 }}
  groups:
    {{- contains .schema.groups }}
    - name: _deletion_task
      catalog: property
      shardNum: 1
      replicas: 0
      segmentInterval: none
      ttl: none
      defaultStages: []
      stages: []
    - name: sw_metadata
      catalog: measure
      shardNum: 2
      replicas: 0
      segmentInterval: 15d
      ttl: 15d
      defaultStages: ["hot"]
      stages: []
    - name: sw_metricsDay
      catalog: measure
      shardNum: 1
      replicas: 0
      segmentInterval: 15d
      ttl: 1d
      defaultStages: ["hot", "warm"]
      stages:
        - name: warm
          shardNum: 1
          replicas: 0
          segmentInterval: 15d
          ttl: 30d
          nodeSelector: "type=warm"
          close: false
    - name: sw_metricsHour
      catalog: measure
      shardNum: 1
      replicas: 0
      segmentInterval: 5d
      ttl: 1d
      defaultStages: ["hot", "warm"]
      stages:
        - name: warm
          shardNum: 1
          replicas: 0
          segmentInterval: 10d
          ttl: 30d
          nodeSelector: "type=warm"
          close: false
    - name: sw_metricsMinute
      catalog: measure
      shardNum: 2
      replicas: 0
      segmentInterval: 1d
      ttl: 1d
      defaultStages: ["hot", "warm"]
      stages:
        - name: warm
          shardNum: 2
          replicas: 0
          segmentInterval: 3d
          ttl: 15d
          nodeSelector: "type=warm"
          close: false
    - name: sw_property
      catalog: property
      shardNum: 1
      replicas: 0
      segmentInterval: none
      ttl: none
      defaultStages: ["hot"]
      stages: []
    - name: sw_records
      catalog: stream
      shardNum: 1
      replicas: 0
      segmentInterval: 1d
      ttl: 1d
      defaultStages: ["hot", "warm"]
      stages:
        - name: warm
          shardNum: 1
          replicas: 0
          segmentInterval: 2d
          ttl: 7d
          nodeSelector: "type=warm"
          close: false
    - name: sw_trace
      catalog: trace
      shardNum: 2
      replicas: 0
      segmentInterval: 1d
      ttl: 1d
      defaultStages: ["hot", "warm"]
      stages:
        - name: warm
          shardNum: 2
          replicas: 0
          segmentInterval: 1d
          ttl: 7d
          nodeSelector: "type=warm"
          close: false
    - name: sw_zipkinTrace
      catalog: trace
      shardNum: 2
      replicas: 0
      segmentInterval: 1d
      ttl: 3d
      defaultStages: ["hot"]
      stages: []
    {{- end }}
  resources:
    {{- contains .schema.resources }}
    - kind: measure
      group: sw_metadata
      name: service_traffic_minute
      entity: ["id"]
      interval: 1m
      indexMode: true
      tags: ["storage-only.id:STRING", "searchable.service_traffic_name:STRING", "searchable.short_name:STRING", "searchable.service_id:STRING", "searchable.service_group:STRING", "searchable.layer:INT"]
      fields: []
      indexRules: ["layer", "service_group", "service_id", "service_traffic_name", "short_name"]
    - kind: measure
      group: sw_metricsDay
      name: service_cpm_day
      entity: ["entity_id"]
      interval: 1d
      indexMode: false
      tags: ["storage-only.entity_id:STRING", "searchable.attr0:STRING", "searchable.attr1:STRING", "searchable.attr2:STRING", "searchable.attr3:STRING", "searchable.attr4:STRING", "searchable.attr5:STRING"]
      fields: ["value:INT", "total:INT"]
      indexRules: ["attr0", "attr1", "attr2", "attr3", "attr4", "attr5"]
    - kind: measure
      group: sw_metricsDay
      name: service_resp_time_day
      entity: ["entity_id"]
      interval: 1d
      indexMode: false
      tags: ["storage-only.entity_id:STRING", "searchable.attr0:STRING", "searchable.attr1:STRING", "searchable.attr2:STRING", "searchable.attr3:STRING", "searchable.attr4:STRING", "searchable.attr5:STRING"]
      fields: ["summation:INT", "count:INT", "value:INT"]
      indexRules: ["attr0", "attr1", "attr2", "attr3", "attr4", "attr5"]
    - kind: measure
      group: sw_metricsHour
      name: service_cpm_hour
      entity: ["entity_id"]
      interval: 1h
      indexMode: false
      tags: ["storage-only.entity_id:STRING", "searchable.attr0:STRING", "searchable.attr1:STRING", "searchable.attr2:STRING", "searchable.attr3:STRING", "searchable.attr4:STRING", "searchable.attr5:STRING"]
      fields: ["value:INT", "total:INT"]
      indexRules: ["attr0", "attr1", "attr2", "attr3", "attr4", "attr5"]
    - kind: measure
      group: sw_metricsHour
      name: service_resp_time_hour
      entity: ["entity_id"]
      interval: 1h
      indexMode: false
      tags: ["storage-only.entity_id:STRING", "searchable.attr0:STRING", "searchable.attr1:STRING", "searchable.attr2:STRING", "searchable.attr3:STRING", "searchable.attr4:STRING", "searchable.attr5:STRING"]
      fields: ["summation:INT", "count:INT", "value:INT"]
      indexRules: ["attr0", "attr1", "attr2", "attr3", "attr4", "attr5"]
    - kind: measure
      group: sw_metricsMinute
      name: service_cpm_minute
      entity: ["entity_id"]
      interval: 1m
      indexMode: false
      tags: ["storage-only.entity_id:STRING", "searchable.attr0:STRING", "searchable.attr1:STRING", "searchable.attr2:STRING", "searchable.attr3:STRING", "searchable.attr4:STRING", "searchable.attr5:STRING"]
      fields: ["value:INT", "total:INT"]
      indexRules: ["attr0", "attr1", "attr2", "attr3", "attr4", "attr5"]
    - kind: measure
      group: sw_metricsMinute
      name: service_resp_time_minute
      entity: ["entity_id"]
      interval: 1m
      indexMode: false
      tags: ["storage-only.entity_id:STRING", "searchable.attr0:STRING", "searchable.attr1:STRING", "searchable.attr2:STRING", "searchable.attr3:STRING", "searchable.attr4:STRING", "searchable.attr5:STRING"]
      fields: ["summation:INT", "count:INT", "value:INT"]
      indexRules: ["attr0", "attr1", "attr2", "attr3", "attr4", "attr5"]
    - kind: property
      group: sw_property
      name: ui_template
      tags: ["template_id:STRING", "configuration:STRING", "update_time:INT", "disabled:INT"]
      indexRules: []
    - kind: stream
      group: sw_records
      name: event
      entity: ["uuid"]
      tags: ["storage-only.uuid:STRING", "storage-only.message:STRING", "storage-only.parameters:STRING", "storage-only.timestamp:INT", "searchable.service:STRING", "searchable.service_instance:STRING", "searchable.endpoint:STRING", "searchable.event_name:STRING", "searchable.type:STRING", "searchable.start_time:INT", "searchable.end_time:INT", "searchable.layer:INT"]
      indexRules: ["end_time", "endpoint", "event_name", "layer", "service", "service_instance", "start_time", "type"]
    - kind: trace
      group: sw_trace
      name: segment
      traceIdTag: trace_id
      spanIdTag: segment_id
      timestampTag: start_time
      tags: ["segment_id:STRING", "trace_id:STRING", "service_id:STRING", "service_instance_id:STRING", "endpoint_id:STRING", "start_time:TIMESTAMP", "latency:INT", "is_error:INT", "tags:STRING_ARRAY"]
      indexRules: ["latency", "start_time"]
    {{- end }}
checks:
  schemaOnlyFlag: ok
  noUnits: ok
  noNodeData: ok
  schemaFiles: ok
  filesMatchManifest: ok
  noWarnings: ok
  schemaRefs: ok
leftoverSnapshots: []
checkerExitCode: 0
