# Output of scripts/import-noschema.sh: importing artifact A into the empty destination with
# --include-schema=false is refused before anything is written, as a dry run and for real: both
# exit 2 and print the same decision table, which names the resources missing on the destination,
# the destination schema is identical before and after, and no row is on the destination.
dryRunExitCode: 2
importExitCode: 2
tablesIdentical: true
missingResourcesReported: true
schemaUnchanged: true
dstDataRows: 0
