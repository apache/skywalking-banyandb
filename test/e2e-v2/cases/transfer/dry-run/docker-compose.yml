# Export dry-run e2e: one hot and one warm data node behind a liaison, file-based node
# discovery. OAP + trace-mocker write traces dated MINUS_DAYS ago into the hot node; the
# hot-stage TTL is one day so a one-shot /lifecycle run (see scripts/run-lifecycle.sh)
# migrates the segments whose end is older than that TTL to the warm node. The data and
# liaison services start from ../../lifecycle/file-discovery/docker-compose.yml; keep the
# shared flags in sync when changing either. Intentional differences from that file:
#   - no cold node and no data-generator volumes: all data comes from trace-mocker;
#   - no SkyWalking agent/provider/consumer, trace-mocker is the only data source;
#   - the liaison publishes 17912 on the host (plan.yaml carries a static address);
#   - OAP enables only the warm stage and sets every hot TTL to one day.

services:
  data-hot1:
    extends:
      file: ../../../script/docker-compose/base-compose.yml
      service: data
    hostname: data-hot1
    command: data --node-discovery-mode=file --node-discovery-file-path=/etc/banyandb/nodes.yaml --node-labels type=hot
    volumes:
      - ./nodes.yaml:/etc/banyandb/nodes.yaml
    networks:
      - e2e

  data-warm1:
    extends:
      file: ../../../script/docker-compose/base-compose.yml
      service: data
    hostname: data-warm1
    command: data --node-discovery-mode=file --node-discovery-file-path=/etc/banyandb/nodes.yaml --node-labels type=warm
    volumes:
      - ./nodes.yaml:/etc/banyandb/nodes.yaml
    networks:
      - e2e

  liaison:
    extends:
      file: ../../../script/docker-compose/base-compose.yml
      service: liaison
    command: liaison --node-discovery-mode=file --node-discovery-file-path=/etc/banyandb/nodes.yaml --data-node-selector type=hot
    ports:
      # plan.yaml carries a static connection.nodes entry, so the gRPC port is pinned on the host.
      - 17912:17912
    volumes:
      - ./nodes.yaml:/etc/banyandb/nodes.yaml
    networks:
      - e2e

  oap:
    extends:
      file: ../../../script/docker-compose/base-compose.yml
      service: oap
    environment:
      SW_STORAGE: banyandb
      SW_STORAGE_BANYANDB_TARGETS: "liaison:17912"
      SW_STORAGE_BANYANDB_RECORDS_ENABLE_WARM_STAGE: "true"
      SW_STORAGE_BANYANDB_TRACE_ENABLE_WARM_STAGE: "true"
      SW_STORAGE_BANYANDB_METRICS_MINUTE_ENABLE_WARM_STAGE: "true"
      SW_STORAGE_BANYANDB_METRICS_HOUR_ENABLE_WARM_STAGE: "true"
      SW_STORAGE_BANYANDB_METRICS_DAY_ENABLE_WARM_STAGE: "true"
      # One-day hot stage. The lifecycle run migrates a segment only once its end is older than
      # the TTL: the trace and minute-metrics segments holding trace-mocker's MINUS_DAYS=3 data
      # always qualify, hour/day metrics only once their multi-day segment has ended, and
      # sw_metadata has no warm stage at all, so it stays on the hot node.
      SW_STORAGE_BANYANDB_RECORDS_TTL_DAYS: "1"
      SW_STORAGE_BANYANDB_TRACE_TTL_DAYS: "1"
      SW_STORAGE_BANYANDB_METRICS_MINUTE_TTL_DAYS: "1"
      SW_STORAGE_BANYANDB_METRICS_HOUR_TTL_DAYS: "1"
      SW_STORAGE_BANYANDB_METRICS_DAY_TTL_DAYS: "1"
    ports:
      - 11800
      - 12800
    networks:
      - e2e
    depends_on:
      liaison:
        condition: service_healthy

  trace-mocker:
    image: "ghcr.io/apache/skywalking/trace-mocker:${SW_TRACE_MOCKER_COMMIT}"
    environment:
      OAP_HOST: oap
      MINUS_DAYS: 3
    networks:
      - e2e
    depends_on:
      oap:
        condition: service_healthy

networks:
  e2e:
