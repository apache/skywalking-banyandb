# Values for the skywalking-helm chart (pinned by SW_KUBERNETES_COMMIT_SHA in
# test/e2e-v2/script/env), the same way the rover istio e2e deploys OAP. The
# chart's own BanyanDB stays disabled; OAP targets the hot/warm/cold cluster
# from banyandb-cluster.yaml through the `liaison` Service. Image tags and the
# release name are passed on the helm command line in e2e.yaml.
eckOperator:
  enabled: false
elasticsearch:
  enabled: false
banyandb:
  enabled: false
  config:
    grpcAddress: "liaison:17912"
    httpAddress: "liaison:17913"
oap:
  storageType: banyandb
  replicas: 1
  # The chart defaults to -Xmx2g; keep the OAP heap within what a GitHub runner
  # can spare next to four BanyanDB nodes and the two demo apps.
  javaOpts: -Xmx1g -Xms512m
  # Schema installation against a fresh cluster can exceed the chart's default
  # 90s startup window, which would restart OAP mid-install.
  startupProbe:
    tcpSocket:
      port: 12800
    failureThreshold: 60
    periodSeconds: 10
  env:
    SW_HEALTH_CHECKER: default
    SW_STORAGE_BANYANDB_COMPATIBLE_SERVER_API_VERSIONS: "0.11"
    # Same warm/cold stage switches as ../file-discovery/docker-compose.yml.
    SW_STORAGE_BANYANDB_METRICS_MINUTE_ENABLE_WARM_STAGE: "true"
    SW_STORAGE_BANYANDB_METRICS_MINUTE_ENABLE_COLD_STAGE: "true"
    SW_STORAGE_BANYANDB_METRICS_HOUR_ENABLE_WARM_STAGE: "true"
    SW_STORAGE_BANYANDB_METRICS_HOUR_ENABLE_COLD_STAGE: "true"
    SW_STORAGE_BANYANDB_METRICS_DAY_ENABLE_WARM_STAGE: "true"
    SW_STORAGE_BANYANDB_METRICS_DAY_ENABLE_COLD_STAGE: "true"
    SW_STORAGE_BANYANDB_RECORDS_ENABLE_WARM_STAGE: "true"
    SW_STORAGE_BANYANDB_RECORDS_ENABLE_COLD_STAGE: "true"
    SW_STORAGE_BANYANDB_TRACE_ENABLE_WARM_STAGE: "true"
    SW_STORAGE_BANYANDB_TRACE_ENABLE_COLD_STAGE: "true"
