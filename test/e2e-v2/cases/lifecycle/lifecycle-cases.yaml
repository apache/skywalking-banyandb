# Verify cases shared by the file-discovery (docker-compose) and dns-discovery
# (kind) lifecycle e2e. Both variants pre-load the same generated cold data, so
# the queries and expected files are identical; only the cluster bootstrap differs.
#
# The OAP address uses the kind-style variables ${service_skywalking_oap_host}
# and ${service_skywalking_oap_12800}, which the kind runner exports for the
# helm-deployed `service/skywalking-oap`. The compose runner exports
# ${oap_host}/${oap_12800} instead, so file-discovery/e2e.yaml aliases them to
# these names in a setup step.

cases:
  - query: swctl --display yaml --base-url=http://${service_skywalking_oap_host}:${service_skywalking_oap_12800}/graphql metrics exec --expression="top_n(service_resp_time,3,des,attr0='GENERAL',attr1!='Not_exist')/100"
    expected: ../storage/expected/topN-OP-service.yml

  # cold data test
  - query: swctl --display yaml --base-url=http://${service_skywalking_oap_host}:${service_skywalking_oap_12800}/graphql metrics exec --expression=service_resp_time --service-name=mock_a_service --start="-96h" --end="-48h" --cold=true --step=DAY
    expected: ../storage/expected/metrics-has-value.yml
  - query: swctl --display yaml --base-url=http://${service_skywalking_oap_host}:${service_skywalking_oap_12800}/graphql dependency service --service-name=mock_a_service  --start="-96h" --end="-48h" --cold=true --step=DAY
    expected: ./expected/dependency-services.yml
  - query: swctl --display yaml --base-url=http://${service_skywalking_oap_host}:${service_skywalking_oap_12800}/graphql dependency instance --service-name=mock_a_service --dest-service-name=mock_b_service --start="-96h" --end="-48h" --cold=true --step=DAY
    expected: ./expected/dependency-instance.yml
  - query: swctl --display yaml --base-url=http://${service_skywalking_oap_host}:${service_skywalking_oap_12800}/graphql dependency endpoint --service-name=mock_a_service --endpoint-name=/dubbox-case/case/dubbox-rest/404-test --start="-96h" --end="-48h" --cold=true --step=DAY
    expected: ./expected/dependency-endpoint.yml
  # trace list
  - query: swctl --display yaml --base-url=http://${service_skywalking_oap_host}:${service_skywalking_oap_12800}/graphql tv2 ls --service-name=mock_a_service --endpoint-name=/dubbox-case/case/dubbox-rest/404-test --tags http.method=get --start="-96h" --end="-48h" --cold=true
    expected: ./expected/traces-list.yml
  ## topN
  - query: swctl --display yaml --base-url=http://${service_skywalking_oap_host}:${service_skywalking_oap_12800}/graphql metrics exec --expression="top_n(service_resp_time,3,des,attr0='GENERAL')" --start="-96h" --end="-48h" --cold=true --step=DAY
    expected: ./expected/topN-OP-service.yml
  - query: swctl --display yaml --base-url=http://${service_skywalking_oap_host}:${service_skywalking_oap_12800}/graphql metrics exec --expression="top_n(endpoint_resp_time,3,des)" --start="-96h" --end="-48h" --cold=true --step=DAY
    expected: ./expected/topN-OP-endpoint.yml
