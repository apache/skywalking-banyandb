# The nightly distributed stress revision preserves the administrator but removes every tenant
# binding. It turns a reader's formerly allowed alpha request into a stable PermissionDenied
# outcome, making a fail-open interval observable while both liaisons reload the shared file.

users:
  - username: bydb-admin
    password: admin-secret
  - username: bydb-reader
    password: reader-secret
  - username: bydb-writer
    password: writer-secret
  - username: bydb-auth-only
    password: auth-only-secret

rbac:
  enabled: true
  roles: {}
  bindings:
    - principal: bydb-admin
      role: admin
      groups: ["*"]
