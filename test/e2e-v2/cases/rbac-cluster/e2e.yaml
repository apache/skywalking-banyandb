# Distributed direct-client RBAC coverage for #14016, owning E-DST-01 and E-DST-02. Two liaison
# endpoints read one mounted policy revision; the case proves their public decisions agree and
# that the internal schema and data flows between liaison and data node stay healthy under it.

setup:
  env: compose
  file: docker-compose.yml
  timeout: 20m
  init-system-environment: ../../script/env
  steps:
    - name: set PATH
      command: export PATH=/tmp/skywalking-infra-e2e/bin:$PATH
    - name: install buf
      command: GOBIN=/tmp/skywalking-infra-e2e/bin go install github.com/bufbuild/buf/cmd/buf@v1.47.2
    - name: install grpcurl
      command: GOBIN=/tmp/skywalking-infra-e2e/bin go install github.com/fullstorydev/grpcurl/cmd/grpcurl@v1.9.3
    - name: build BanyanDB API descriptor set
      command: buf build api/proto -o /tmp/rbac-cluster-api.bin

verify:
  retry:
    # The journey writes through one endpoint and reads through the other, so it depends on
    # its own accumulated state and must execute once rather than replay.
    count: 0
  cases:
    - query: >-
        bash test/e2e-v2/cases/rbac-cluster/check-rbac-cluster.sh
        ${liaison-a_host}:${liaison-a_17912}
        ${liaison-a_host}:${liaison-a_17913}
        ${liaison-b_host}:${liaison-b_17912}
        ${liaison-b_host}:${liaison-b_17913}
      expected: expected/success.yaml

cleanup:
  on: always
