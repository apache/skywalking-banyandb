# Two liaison endpoints and one data node, all reading one mounted policy revision. Only the
# BanyanDB service definitions are reused from the cluster case; there is no OAP, agent or
# Canopy dependency, because #13994 ends at direct clients.

version: '2.1'

services:
  data:
    extends:
      file: ../../script/docker-compose/base-compose.yml
      service: data
    command: data --node-discovery-mode=file --node-discovery-file-path=/etc/banyandb/nodes.yaml
    volumes:
      - ./nodes.yaml:/etc/banyandb/nodes.yaml
    networks:
      - e2e

  # Each liaison copies the mounted revision to a private path and tightens it to 0600 before
  # starting, because the liaison refuses a policy file any other account can read.
  liaison-a:
    extends:
      file: ../../script/docker-compose/base-compose.yml
      service: liaison
    hostname: liaison-a
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        cp /etc/banyandb/security.template.yaml /tmp/security.yaml
        chmod 0600 /tmp/security.yaml
        exec /banyand liaison --node-discovery-mode=file \
          --node-discovery-file-path=/etc/banyandb/nodes.yaml \
          --auth-config-file=/tmp/security.yaml
    healthcheck:
      test: ["CMD", "./bydbctl", "health", "--config=-", "--addr=http://liaison-a:17913"]
      interval: 5s
      timeout: 120s
      retries: 120
    volumes:
      - ./nodes.yaml:/etc/banyandb/nodes.yaml
      - ./security.yaml:/etc/banyandb/security.template.yaml:ro
    ports:
      - 17912
      - 17913
      - 2121
    networks:
      - e2e

  liaison-b:
    extends:
      file: ../../script/docker-compose/base-compose.yml
      service: liaison
    hostname: liaison-b
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        cp /etc/banyandb/security.template.yaml /tmp/security.yaml
        chmod 0600 /tmp/security.yaml
        exec /banyand liaison --node-discovery-mode=file \
          --node-discovery-file-path=/etc/banyandb/nodes.yaml \
          --auth-config-file=/tmp/security.yaml
    healthcheck:
      test: ["CMD", "./bydbctl", "health", "--config=-", "--addr=http://liaison-b:17913"]
      interval: 5s
      timeout: 120s
      retries: 120
    volumes:
      - ./nodes.yaml:/etc/banyandb/nodes.yaml
      - ./security.yaml:/etc/banyandb/security.template.yaml:ro
    ports:
      - 17912
      - 17913
      - 2121
    networks:
      - e2e

networks:
  e2e:
