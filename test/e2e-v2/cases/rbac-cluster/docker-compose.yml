# Two liaison endpoints and one data node, all reading one policy revision from a shared named
# volume. The init service gives the watched file the 0600 mode the liaison requires, while the
# nightly stress journey can replace it in place without restarting either liaison.

version: '2.1'

services:
  rbac-policy-init:
    image: "apache/skywalking-banyandb:${TAG}-testing"
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        cp /etc/banyandb/security.template.yaml /rbac-policy/security.yaml
        chmod 0600 /rbac-policy/security.yaml
    volumes:
      - ./security.yaml:/etc/banyandb/security.template.yaml:ro
      - rbac-policy:/rbac-policy
    networks:
      - e2e

  data:
    extends:
      file: ../../script/docker-compose/base-compose.yml
      service: data
    command: data --node-discovery-mode=file --node-discovery-file-path=/etc/banyandb/nodes.yaml
    volumes:
      - ./nodes.yaml:/etc/banyandb/nodes.yaml
    networks:
      - e2e

  # The policy-init service prepares the shared watched file before either liaison starts.
  liaison-a:
    extends:
      file: ../../script/docker-compose/base-compose.yml
      service: liaison
    hostname: liaison-a
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        exec /banyand liaison --node-discovery-mode=file \
          --node-discovery-file-path=/etc/banyandb/nodes.yaml \
          --auth-config-file=/rbac-policy/security.yaml
    depends_on:
      rbac-policy-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "./bydbctl", "health", "--config=-", "--addr=http://liaison-a:17913"]
      interval: 5s
      timeout: 120s
      retries: 120
    volumes:
      - ./nodes.yaml:/etc/banyandb/nodes.yaml
      - ./security-revoked.yaml:/etc/banyandb/security.revoked.template.yaml:ro
      - rbac-policy:/rbac-policy
    ports:
      - 17912
      - 17913
      - 2121
    networks:
      - e2e

  liaison-b:
    extends:
      file: ../../script/docker-compose/base-compose.yml
      service: liaison
    hostname: liaison-b
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        exec /banyand liaison --node-discovery-mode=file \
          --node-discovery-file-path=/etc/banyandb/nodes.yaml \
          --auth-config-file=/rbac-policy/security.yaml
    depends_on:
      rbac-policy-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "./bydbctl", "health", "--config=-", "--addr=http://liaison-b:17913"]
      interval: 5s
      timeout: 120s
      retries: 120
    volumes:
      - ./nodes.yaml:/etc/banyandb/nodes.yaml
      - ./security-revoked.yaml:/etc/banyandb/security.revoked.template.yaml:ro
      - rbac-policy:/rbac-policy
    ports:
      - 17912
      - 17913
      - 2121
    networks:
      - e2e

networks:
  e2e:

volumes:
  rbac-policy:
