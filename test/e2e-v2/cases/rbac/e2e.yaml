# Direct standalone BanyanDB RBAC coverage for #14014. This case has no OAP or
# Canopy dependency: generated gRPC clients are exercised through grpcurl and
# the same decisions are repeated through the bound grpc-gateway routes.

setup:
  env: compose
  file: docker-compose.yml
  timeout: 10m
  init-system-environment: ../../script/env
  steps:
    - name: set PATH
      command: export PATH=/tmp/skywalking-infra-e2e/bin:$PATH
    - name: install buf
      command: GOBIN=/tmp/skywalking-infra-e2e/bin go install github.com/bufbuild/buf/cmd/buf@v1.47.2
    - name: install grpcurl
      command: GOBIN=/tmp/skywalking-infra-e2e/bin go install github.com/fullstorydev/grpcurl/cmd/grpcurl@v1.9.3
    - name: build BanyanDB API descriptor set
      command: buf build api/proto -o /tmp/rbac-api.bin

verify:
  retry:
    # This case validates exact metric deltas and live reload state, so it must
    # execute once rather than replay a stateful sequence after an assertion.
    count: 1
    interval: 5s
  cases:
    # The schema stage runs first: check-rbac.sh finishes by rewriting the mounted
    # policy to a revoked and then a malformed revision, which the schema matrix
    # must not observe.
    - query: >-
        bash test/e2e-v2/cases/rbac/check-rbac-schema.sh
        ${banyandb_host}:${banyandb_17912}
        ${banyandb_host}:${banyandb_17913}
      expected: expected/success.yaml
    - query: >-
        bash test/e2e-v2/cases/rbac/check-rbac.sh
        ${banyandb_host}:${banyandb_17912}
        ${banyandb_host}:${banyandb_17913}
        ${banyandb_host}:${banyandb_2121}
        ${noauth_host}:${noauth_17912}
        ${noauth_host}:${noauth_17913}
      expected: expected/success.yaml

cleanup:
  on: always
