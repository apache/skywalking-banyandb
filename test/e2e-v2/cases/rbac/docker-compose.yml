services:
  banyandb:
    extends:
      file: ../../script/docker-compose/base-compose.yml
      service: banyandb
    hostname: banyandb
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        cp /etc/banyandb/security.template.yaml /tmp/security.yaml
        chmod 0600 /tmp/security.yaml
        exec /banyand standalone --auth-config-file=/tmp/security.yaml
    volumes:
      - ${RBAC_CONFIG_DIR:-.}/security.yaml:/etc/banyandb/security.template.yaml:ro
      - ${RBAC_CONFIG_DIR:-.}/security-revoked.yaml:/etc/banyandb/security.revoked.yaml:ro
      - ${RBAC_CONFIG_DIR:-.}/security-malformed.yaml:/etc/banyandb/security.malformed.yaml:ro
    ports:
      - 17912
      - 17913
      - 2121
    networks:
      - e2e

  noauth:
    extends:
      file: ../../script/docker-compose/base-compose.yml
      service: banyandb
    hostname: noauth
    command: standalone
    healthcheck:
      test: ["CMD", "./bydbctl", "health", "--config=-", "--addr=http://noauth:17913"]
    ports:
      - 17912
      - 17913
    networks:
      - e2e

networks:
  e2e:
