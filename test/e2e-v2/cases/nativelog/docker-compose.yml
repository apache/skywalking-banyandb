version: '2.1'

# Five data nodes store their own logs, and one more, data5, runs with native
# logging off, its default. The log group has one shard, so the five producers
# outnumber the shards: each must still keep its own logs on itself, in shard
# 0, and never send them to another node. One Go process holds one native
# sink and therefore one identity, which is why these cases are here and not
# in test/integration.
#
# Every node polls the schema every second. A data node that has not seen the
# log stream yet answers a liaison query with "stream doesn't exist", and the
# liaison then fails the whole query (apache/skywalking#14104).
services:
  data0:
    extends:
      file: ../../script/docker-compose/base-compose.yml
      service: data
    hostname: data0
    mem_limit: 1g
    command: data --node-discovery-mode=file --node-discovery-file-path=/etc/banyandb/nodes.yaml --schema-property-client-sync-interval=1s --logging-native-enabled --logging-native-level=info
    volumes:
      - ./nodes.yaml:/etc/banyandb/nodes.yaml
    networks:
      - e2e

  data1:
    extends:
      file: ../../script/docker-compose/base-compose.yml
      service: data
    hostname: data1
    mem_limit: 1g
    command: data --node-discovery-mode=file --node-discovery-file-path=/etc/banyandb/nodes.yaml --schema-property-client-sync-interval=1s --logging-native-enabled --logging-native-level=info
    volumes:
      - ./nodes.yaml:/etc/banyandb/nodes.yaml
    networks:
      - e2e

  data2:
    extends:
      file: ../../script/docker-compose/base-compose.yml
      service: data
    hostname: data2
    mem_limit: 1g
    command: data --node-discovery-mode=file --node-discovery-file-path=/etc/banyandb/nodes.yaml --schema-property-client-sync-interval=1s --logging-native-enabled --logging-native-level=info
    volumes:
      - ./nodes.yaml:/etc/banyandb/nodes.yaml
    networks:
      - e2e

  data3:
    extends:
      file: ../../script/docker-compose/base-compose.yml
      service: data
    hostname: data3
    mem_limit: 1g
    command: data --node-discovery-mode=file --node-discovery-file-path=/etc/banyandb/nodes.yaml --schema-property-client-sync-interval=1s --logging-native-enabled --logging-native-level=info
    volumes:
      - ./nodes.yaml:/etc/banyandb/nodes.yaml
    networks:
      - e2e

  data4:
    extends:
      file: ../../script/docker-compose/base-compose.yml
      service: data
    hostname: data4
    mem_limit: 1g
    command: data --node-discovery-mode=file --node-discovery-file-path=/etc/banyandb/nodes.yaml --schema-property-client-sync-interval=1s --logging-native-enabled --logging-native-level=info
    volumes:
      - ./nodes.yaml:/etc/banyandb/nodes.yaml
    networks:
      - e2e

  data5:
    extends:
      file: ../../script/docker-compose/base-compose.yml
      service: data
    hostname: data5
    mem_limit: 1g
    command: data --node-discovery-mode=file --node-discovery-file-path=/etc/banyandb/nodes.yaml --schema-property-client-sync-interval=1s
    volumes:
      - ./nodes.yaml:/etc/banyandb/nodes.yaml
    networks:
      - e2e

  # Native logging on, and its stream storage read-only: watermark 0 is the
  # storage's explicit read-only mode, so every native write is refused.
  data6:
    extends:
      file: ../../script/docker-compose/base-compose.yml
      service: data
    hostname: data6
    mem_limit: 1g
    command: data --node-discovery-mode=file --node-discovery-file-path=/etc/banyandb/nodes.yaml --schema-property-client-sync-interval=1s --logging-native-enabled --logging-native-level=info --stream-retention-high-watermark=0 --stream-retention-low-watermark=0
    volumes:
      - ./nodes.yaml:/etc/banyandb/nodes.yaml
    networks:
      - e2e

  liaison:
    extends:
      file: ../../script/docker-compose/base-compose.yml
      service: liaison
    mem_limit: 512m
    # Native logging on: the liaison has no storage, so it sends its own logs
    # to the data node that owns shard 0 of the log group.
    command: liaison --node-discovery-mode=file --node-discovery-file-path=/etc/banyandb/nodes.yaml --schema-property-client-sync-interval=1s --logging-native-enabled --logging-native-level=info
    # Declared here, and not only inherited: the e2e runner exports
    # ${liaison_host} and ${liaison_17913} from the ports a case names itself.
    # Without this the case receives an empty address.
    ports:
      - 17913
    volumes:
      - ./nodes.yaml:/etc/banyandb/nodes.yaml
    networks:
      - e2e
    depends_on:
      data0:
        condition: service_healthy
      data1:
        condition: service_healthy
      data2:
        condition: service_healthy
      data3:
        condition: service_healthy
      data4:
        condition: service_healthy
      data5:
        condition: service_healthy
      data6:
        condition: service_healthy

networks:
  e2e:
