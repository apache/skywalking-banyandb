version: '2.1'

services:
  # Two data nodes with native logging on, so a case can check that each one
  # stores its own events under its own identity. One process cannot hold two
  # identities, which is why this case is here and not in test/integration.
  data0:
    extends:
      file: ../../script/docker-compose/base-compose.yml
      service: data
    hostname: data0
    mem_limit: 1536m
    command: data --node-discovery-mode=file --node-discovery-file-path=/etc/banyandb/nodes.yaml --logging-native-enabled --logging-native-level=info
    volumes:
      - ./nodes.yaml:/etc/banyandb/nodes.yaml
    networks:
      - e2e

  data1:
    extends:
      file: ../../script/docker-compose/base-compose.yml
      service: data
    hostname: data1
    mem_limit: 1536m
    command: data --node-discovery-mode=file --node-discovery-file-path=/etc/banyandb/nodes.yaml --logging-native-enabled --logging-native-level=info
    volumes:
      - ./nodes.yaml:/etc/banyandb/nodes.yaml
    networks:
      - e2e

  liaison:
    extends:
      file: ../../script/docker-compose/base-compose.yml
      service: liaison
    mem_limit: 512m
    command: liaison --node-discovery-mode=file --node-discovery-file-path=/etc/banyandb/nodes.yaml
    volumes:
      - ./nodes.yaml:/etc/banyandb/nodes.yaml
    networks:
      - e2e
    depends_on:
      data0:
        condition: service_healthy
      data1:
        condition: service_healthy

networks:
  e2e:
