setup:
  env: compose
  file: docker-compose.yml
  timeout: 20m
  init-system-environment: ../../script/env
  steps:
    - name: set PATH
      command: export PATH=/tmp/skywalking-infra-e2e/bin:$PATH

verify:
  # Each script polls until its rows arrive, so one run is enough. A retry
  # would create another marker group and check that one instead.
  retry:
    count: 0
  cases:
    - query: >-
        bash test/e2e-v2/cases/nativelog/check-identities.sh
        ${liaison_host}:${liaison_17913}
      expected: expected/identities.yaml
    - query: >-
        bash test/e2e-v2/cases/nativelog/check-placement.sh
        ${liaison_host}:${liaison_17913}
      expected: expected/placement.yaml
    - query: >-
        bash test/e2e-v2/cases/nativelog/check-refusal.sh
        ${liaison_host}:${liaison_17913}
      expected: expected/refusal.yaml
    # It pauses a data node and resumes it before it ends.
    - query: >-
        bash test/e2e-v2/cases/nativelog/check-liaison.sh
        ${liaison_host}:${liaison_17913}
      expected: expected/liaison.yaml
    # Last: it restarts a data node.
    - query: >-
        bash test/e2e-v2/cases/nativelog/check-restart.sh
        ${liaison_host}:${liaison_17913}
      expected: expected/restart.yaml

cleanup:
  on: always
  collect:
    on: failure
    output-dir: $SW_INFRA_E2E_LOG_DIR/banyandb-data
    items:
      - service: data0
        paths:
          - /tmp/stream/
      - service: data1
        paths:
          - /tmp/stream/
      - service: data2
        paths:
          - /tmp/stream/
      - service: data3
        paths:
          - /tmp/stream/
      - service: data4
        paths:
          - /tmp/stream/
      - service: data5
        paths:
          - /tmp/stream/
      - service: data6
        paths:
          - /tmp/stream/
