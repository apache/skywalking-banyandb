# Phases 3 and 4 of native self-stored logs: producers with no storage engine.
setup:
  env: compose
  file: docker-compose.yml
  timeout: 20m
  init-system-environment: ../../script/env
  steps:
    - name: set PATH
      command: export PATH=/tmp/skywalking-infra-e2e/bin:$PATH

verify:
  # Each script polls until its rows arrive, so one run is enough.
  retry:
    count: 0
  cases:
    - query: >-
        bash test/e2e-v2/cases/nativelog-producers/check-producers.sh
        ${liaison_host}:${liaison_17913} ${lifecycle0_host}:${lifecycle0_17915}
      expected: expected/producers.yaml
    # Last: it pauses a data node.
    - query: >-
        bash test/e2e-v2/cases/nativelog-producers/check-recovery.sh
        ${liaison_host}:${liaison_17913}
      expected: expected/recovery.yaml

cleanup:
  on: always
